<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobiTouch Municipality — Staff Dashboard</title>
    <meta
      name="description"
      content="Municipal staff dashboard for managing citizen requests and complaints."
    />
    <!-- An internal tool has no business in a search index. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f9f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1d17" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!--
      Applies the persisted theme before first paint, so a dark-mode user never
      sees a flash of the light theme while ThemeProvider mounts and reads
      localStorage. Keep the storage key in sync with THEME_STORAGE_KEY in
      components/theme-provider.tsx.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mobitouch-theme") || "system";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
          document.documentElement.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="flex min-h-full flex-col antialiased">
    <div id="root" class="flex flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
